name: Coverage
on:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          package-manager: bun
